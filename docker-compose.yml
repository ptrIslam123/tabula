version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sqldb
    env_file:
      - .env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - board_network
    restart: unless-stopped

  board:
    build: .
    env_file:
      - .env.board
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./src:/app
    networks:
      - board_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  board_network: